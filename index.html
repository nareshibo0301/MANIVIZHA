<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manivizha | INVITE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fcf2dd; --cream2:#fce9cc; --sand:#f8deb2; --peach:#f5d19b; --gold:#ebb260; --gold-d:#b98336;
  --brown:#4a2e14; --brown2:#6b4520; --ink:#3a2412; --muted:#8a6a48; --line:#f1dcb8; --paper:#fffaf0; --err:#b3363f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --goldfx:linear-gradient(110deg,#b98336 0%,#f3cf8e 28%,#d49a45 50%,#f6dba4 72%,#b98336 100%);
  --ease:cubic-bezier(.22,.8,.24,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;font-family:var(--sans);color:var(--ink);
  background:radial-gradient(1000px 560px at 50% -8%,var(--cream),transparent 70%),linear-gradient(160deg,var(--sand),var(--peach));
  display:flex;align-items:center;justify-content:center;
  padding:clamp(20px,4vw,56px);overflow-x:hidden;
}
body.locked{overflow:hidden;height:100vh}

/* ---------- drifting gold dust ---------- */
#dust{position:fixed;inset:0;pointer-events:none;z-index:1}
#dust i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle,#fff6dc,var(--gold) 60%,transparent 70%);opacity:0;
  animation:rise var(--d) linear var(--w) infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.8}100%{transform:translate(var(--x),-108vh);opacity:0}}

/* ---------- envelope intro ---------- */
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
.curtain{position:absolute;top:0;bottom:0;width:50.2%;
  background:linear-gradient(160deg,var(--cream2),var(--peach));transition:transform 1s var(--ease) .1s}
.curtain.l{left:0;box-shadow:1px 0 0 var(--gold)}
.curtain.r{right:0;box-shadow:-1px 0 0 var(--gold)}
.intro.go .curtain.l{transform:translateX(-101%)}
.intro.go .curtain.r{transform:translateX(101%)}
.env{position:relative;width:min(340px,82vw);aspect-ratio:3/2;perspective:900px;text-align:center;
  transition:transform .6s var(--ease),opacity .5s;filter:drop-shadow(0 26px 30px rgba(110,70,25,.35))}
.intro.go .env{transform:translateY(-30px) scale(.9);opacity:0;transition-delay:.55s}
.env .back,.env .front,.env .flap{position:absolute;inset:0}
.env .back{background:var(--gold);border-radius:6px}
.env .front{border-radius:6px;background:linear-gradient(160deg,var(--sand),var(--peach));
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .flap{height:62%;background:linear-gradient(180deg,#f8deb2,#f1c27c);border-radius:6px 6px 0 0;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s var(--ease)}
.intro.go .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:56%;width:78px;height:78px;margin:-39px 0 0 -39px;border:0;border-radius:50%;
  cursor:pointer;color:var(--cream);font:600 1.15rem/1 var(--serif);letter-spacing:.06em;
  background:radial-gradient(circle at 32% 28%,#d9a04c,#9a6420 78%);
  box-shadow:0 6px 14px rgba(70,40,10,.45),inset 0 0 0 4px rgba(252,242,221,.28),inset 0 0 0 5px rgba(70,40,10,.25);
  animation:pulse 2.2s ease-in-out infinite;transition:opacity .3s}
.seal:focus-visible{outline:3px solid var(--brown);outline-offset:4px}
.intro.go .seal{opacity:0;animation:none}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 6px 22px rgba(185,131,54,.7),inset 0 0 0 4px rgba(252,242,221,.28)}}
.hint{position:absolute;left:0;right:0;top:calc(100% + 26px);font:italic 500 1.25rem var(--serif);color:var(--brown2);transition:opacity .3s}
.intro.go .hint{opacity:0}

/* ---------- stage ---------- */
.stage{position:relative;z-index:2;width:100%;max-width:1400px;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(350px,430px) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:center}

.invite-display{display:contents}
.photo{margin:0;aspect-ratio:1127/1600;padding:9px;border-radius:20px;background:var(--goldfx);
  box-shadow:0 34px 60px -28px rgba(110,70,25,.55)}
.photo.l{grid-column:1;grid-row:1}
.card{grid-column:2;grid-row:1}
.photo.r{grid-column:3;grid-row:1}
.photo .in{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;border:5px solid var(--paper);
  background:linear-gradient(160deg,var(--cream2),var(--gold))}
.photo.r .in{background:linear-gradient(200deg,var(--cream),var(--peach) 60%,var(--gold))}
.photo .image-flipper{display:contents}
.photo .image-flipper .invite-back{display:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12);transition:transform 2.4s var(--ease)}
body.open .photo img{transform:scale(1)}

.card{position:relative;background:var(--paper);border-radius:22px;text-align:center;
  padding:clamp(34px,4.4vw,52px) clamp(24px,3.4vw,42px);
  box-shadow:0 44px 80px -32px rgba(110,70,25,.5),inset 0 0 0 1px var(--peach),inset 0 0 0 8px var(--paper),inset 0 0 0 9px var(--line)}
.card::before,.card::after{content:"";position:absolute;width:34px;height:34px;border:1.5px solid var(--gold)}
.card::before{top:20px;left:20px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.card::after{bottom:20px;right:20px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.kicker{margin:0 0 6px;font:italic 500 1.2rem var(--serif);color:var(--gold-d)}
h1{margin:0;font:600 clamp(2.2rem,4.2vw,3rem)/1.04 var(--serif);letter-spacing:.01em;
  background:var(--goldfx);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(74,46,20,.15))}
body.open h1{animation:sheen 3.2s var(--ease) .9s 1 both}
@keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 14px;width:70%}
.rule b{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold));transform-origin:right}
.rule b:last-child{background:linear-gradient(270deg,transparent,var(--gold));transform-origin:left}
.rule s{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);text-decoration:none}
.sub{margin:0 0 26px;color:var(--muted);font-size:.93rem;line-height:1.6}

form{text-align:left}
.field{margin-bottom:17px}
label,.legend{display:block;margin-bottom:7px;font-size:.85rem;font-weight:600;color:var(--brown2)}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:1rem;color:var(--ink);padding:13px 15px;background:#fff;
  border:1.5px solid var(--line);border-radius:12px;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#c4a57a}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(235,178,96,.28)}
.error{display:none;margin-top:6px;font-size:.8rem;color:var(--err)}
.invalid input{border-color:var(--err)}
.invalid>.error,fieldset.invalid>.error{display:block}
fieldset{border:0;padding:0;margin:0 0 24px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{margin:0;padding:13px 10px;text-align:center;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-size:1rem;color:var(--muted);transition:all .2s}
.choice label:hover{border-color:var(--gold)}
.choice input:checked+label{background:linear-gradient(160deg,var(--brown2),var(--brown));border-color:var(--brown);color:var(--cream);
  box-shadow:0 8px 16px -8px rgba(74,46,20,.7)}
.choice input:focus-visible+label{box-shadow:0 0 0 4px rgba(235,178,96,.45)}
fieldset.invalid .choice label{border-color:var(--err)}
button.send{position:relative;overflow:hidden;width:100%;font:600 1rem var(--sans);letter-spacing:.02em;padding:16px;border:0;border-radius:12px;
  cursor:pointer;color:var(--cream);background:linear-gradient(160deg,var(--brown2),var(--brown));transition:transform .15s,box-shadow .2s;
  box-shadow:0 14px 24px -14px rgba(74,46,20,.8)}
button.send::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(246,219,164,.45),transparent)}
button.send:hover::after{left:130%;transition:left .8s var(--ease)}
button.send:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.send:active{transform:translateY(1px)}
button.send[disabled]{opacity:.65;cursor:wait}

/* ---------- reply confirmation ---------- */
.done{display:none}
.card.sent form,.card.sent .head{display:none}
.card.sent .done{display:block;animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.done .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;color:#fff;
  background:radial-gradient(circle at 32% 28%,#d9a04c,#9a6420 80%);box-shadow:0 0 0 6px rgba(235,178,96,.25)}
.done h2{margin:0 0 8px;font:600 2.1rem/1.1 var(--serif);color:var(--brown)}
.done p{margin:0;color:var(--muted);line-height:1.6}

/* ---------- one orchestrated entrance ---------- */
.photo.l,.photo.r,.card{opacity:0}
body.open .photo.l{animation:arch 1.4s var(--ease) .15s both}
body.open .photo.r{animation:arch 1.4s var(--ease) .3s both}
body.open .card{animation:cardin 1.1s var(--ease) .45s both}
@keyframes arch{from{opacity:1;clip-path:inset(100% 0 0 0 round 20px)}to{opacity:1;clip-path:inset(0 round 20px)}}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
.rule b{transform:scaleX(0)}
body.open .rule b{animation:draw 1s var(--ease) 1.1s both}
@keyframes draw{to{transform:scaleX(1)}}

.photo .in{cursor:zoom-in}
.tag,.zoom{position:absolute;background:rgba(255,250,240,.92);color:var(--brown2);box-shadow:0 2px 8px rgba(74,46,20,.25)}
.tag{top:14px;left:14px;padding:4px 11px;border-radius:99px;font:600 .74rem var(--sans)}
.zoom{right:14px;bottom:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:1rem}
.photo .in:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.language-switch{display:none}
.language-choice{min-width:32px;height:28px;padding:4px 8px;border:0;border-radius:999px;background:transparent;color:var(--brown2);
  font:600 .78rem/1 var(--sans);transition:background .2s,color .2s}
.language-choice[aria-pressed=true]{background:var(--brown);color:var(--cream)}
.language-choice:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.lb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(50,30,10,.86);cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:min(94vw,900px);max-height:94vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.host{margin:0 0 14px;font:600 1.12rem/1.4 var(--serif);color:var(--brown)}
.when{margin:0 0 10px;font-size:.92rem;line-height:1.55;color:var(--brown2)}
.when strong{font-weight:600;color:var(--ink)}
.where{margin:0 0 24px;font-size:.82rem;line-height:1.55;color:var(--muted)}
@media (max-width:900px){
  .stage{grid-template-columns:1fr;max-width:440px}
  .invite-display{display:flex;width:100%;grid-column:1;grid-row:auto;flex-direction:column;gap:10px;order:1}
  .photo.l{width:100%;grid-column:1;grid-row:auto}
  .photo.l .in{perspective:1200px}
  .photo.l .image-flipper{position:absolute;inset:0;display:block;transform-style:preserve-3d;
    transition:transform .8s var(--ease)}
  .photo.l .image-flipper.is-english{transform:rotateY(180deg)}
  .photo.l .image-flipper img{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .photo.l .image-flipper .invite-back{display:block;transform:rotateY(180deg)}
  .photo.r{display:none}
  .language-switch{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20;
    display:flex;align-items:center;gap:2px;padding:3px;border:1px solid rgba(185,131,54,.45);border-radius:999px;
    background:rgba(255,250,240,.94);box-shadow:0 3px 12px rgba(74,46,20,.2);backdrop-filter:blur(8px)}
  .card{grid-column:1;grid-row:auto;order:2}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .photo.l,.photo.r,.card{opacity:1}.rule b{transform:none}#dust{display:none}
}
</style>
</head>
<body class="locked">

<div id="dust" aria-hidden="true"></div>

<!-- envelope intro -->
<div class="intro" id="intro">
  <div class="curtain l"></div><div class="curtain r"></div>
  <div class="env">
    <div class="back"></div><div class="front"></div><div class="flap"></div>
    <button class="seal" id="seal" aria-label="Open your invitation">OPEN</button>
    <div class="hint">An invitation awaits you</div>
  </div>
</div>

<main class="stage">
  <div class="invite-display">
    <figure class="photo l"><div class="in" id="main-invitation" tabindex="0" role="button" aria-label="Enlarge the Tamil invitation"><div class="image-flipper" id="invite-flipper"><img class="invite-front" src="WhatsApp%20Image%202026-11-19%20at%206.28.20%20PM.jpeg" alt="Manivizha invitation in Tamil"><img class="invite-back" src="WhatsApp%20Image%202026-11-19%20at%206.28.19%20PM.jpeg" alt="Manivizha invitation in English" aria-hidden="true"></div><span class="tag" id="language-tag">Tamil</span><span class="zoom" aria-hidden="true">⤢</span></div></figure>
    <div class="language-switch" role="group" aria-label="Invitation language">
      <button class="language-choice" type="button" data-language="tamil" aria-label="Show Tamil invitation" aria-pressed="true">அ</button>
      <button class="language-choice" type="button" data-language="english" aria-label="Show English invitation" aria-pressed="false">A</button>
    </div>
    <figure class="photo r"><div class="in" tabindex="0" role="button" aria-label="Enlarge the English invitation"><img src="WhatsApp%20Image%202026-11-19%20at%206.28.19%20PM.jpeg" alt="Manivizha invitation in English"><span class="tag">English</span><span class="zoom" aria-hidden="true">⤢</span></div></figure>
  </div>

  <section class="card" id="card" aria-labelledby="title">
    <div class="head">
      <h1 id="title">Manivizha</h1>
      <div class="rule"><b></b><s></s><b></b></div>
      <p class="when"><strong>2 December 2026 · 9:00 AM</strong></p>
    </div>

    <form id="INVITE" novalidate>
      <div class="field" id="f-name">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name">
        <span class="error">Please enter your name.</span>
      </div>
      <div class="field" id="f-phone">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+91 00000 00000">
        <span class="error">Please enter a valid phone number.</span>
      </div>
      <fieldset id="f-attend">
        <span class="legend" id="q">Will you join us for the celebration?</span>
        <div class="choice" role="radiogroup" aria-labelledby="q">
          <input type="radio" id="yes" name="attending" value="Yes"><label for="yes">Yes, I’ll be there</label>
          <input type="radio" id="no" name="attending" value="No"><label for="no">I can’t make it</label>
        </div>
        <span class="error">Please choose an option.</span>
      </fieldset>
      <button type="submit" class="send" id="submit">Send my reply</button>
    </form>

    <div class="done" id="done" role="status" aria-live="polite">
      <div class="mark" id="mark">✓</div>
      <h2 id="done-title"></h2>
      <p id="done-text"></p>
    </div>
  </section>

</main>

<div class="lb" id="lb" hidden role="dialog" aria-label="Invitation preview"><img alt=""></div>

<script>
  const $ = id => document.getElementById(id);
  const body = document.body, intro = $("intro");
  const inviteFlipper = $("invite-flipper");
  const mainInvitation = $("main-invitation");
  const languageTag = $("language-tag");
  const languageChoices = document.querySelectorAll(".language-choice");

  function showInvitation(language) {
    const isEnglish = language === "english";
    inviteFlipper.classList.toggle("is-english", isEnglish);
    mainInvitation.setAttribute("aria-label", `Enlarge the ${isEnglish ? "English" : "Tamil"} invitation`);
    languageTag.textContent = isEnglish ? "English" : "Tamil";
    languageChoices.forEach(button => {
      const selected = button.dataset.language === language;
      button.setAttribute("aria-pressed", String(selected));
    });
    inviteFlipper.querySelector(".invite-front").setAttribute("aria-hidden", String(isEnglish));
    inviteFlipper.querySelector(".invite-back").setAttribute("aria-hidden", String(!isEnglish));
  }

  languageChoices.forEach(button => {
    button.addEventListener("click", () => showInvitation(button.dataset.language));
  });
  showInvitation("tamil");

  /* gold dust */
  if (!matchMedia("(prefers-reduced-motion:reduce)").matches) {
    const dust = $("dust"), frag = document.createDocumentFragment();
    for (let i = 0; i < 18; i++) {
      const p = document.createElement("i"), r = Math.random;
      p.style.cssText = `left:${r()*100}%;--s:${3+r()*5}px;--d:${9+r()*10}s;--w:${-r()*14}s;--x:${(r()-.5)*120}px`;
      frag.appendChild(p);
    }
    dust.appendChild(frag);
  }

  /* open the envelope */
  let opened = false;
  function openInvite() {
    if (opened) return; opened = true;
    intro.classList.add("go");
    setTimeout(() => { body.classList.remove("locked"); body.classList.add("open"); }, 900);
    setTimeout(() => intro.remove(), 2300);
  }
  $("seal").addEventListener("click", openInvite);
  intro.addEventListener("click", openInvite);
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) { intro.remove(); body.classList.remove("locked"); body.classList.add("open"); opened = true; }

  /* enlarge an invitation */
  const lb = $("lb"), lbi = lb.querySelector("img");
  document.querySelectorAll(".photo .in").forEach(el => {
    const open = () => { const im = el.querySelector(".image-flipper.is-english .invite-back") || el.querySelector(".image-flipper .invite-front") || el.querySelector("img"); if (!im) return; lbi.src = im.src; lbi.alt = im.alt; lb.hidden = false; };
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  lb.addEventListener("click", () => lb.hidden = true);
  addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });

  /* INVITE form */
  const form = $("INVITE"), btn = $("submit");
  const flag = (id, bad) => $(id).classList.toggle("invalid", bad);

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = form.name.value.trim(), phone = form.phone.value.trim(), attending = form.attending.value;
    const nameBad = name.length < 2;
    const phoneBad = phone.replace(/\D/g, "").length < 7 || !/^[+\d\s()-]+$/.test(phone);
    const choiceBad = !attending;
    flag("f-name", nameBad); flag("f-phone", phoneBad); flag("f-attend", choiceBad);
    if (nameBad || phoneBad || choiceBad) return;

    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const response = await fetch("/api/rsvp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, phone, attending })
      });
      let result;
      try {
        result = await response.json();
      } catch {
        throw new Error("We couldn’t save your response. Please try again.");
      }
      if (!response.ok) throw new Error(result.error || "We couldn’t save your response.");
    } catch (error) {
      btn.disabled = false; btn.textContent = "Send my reply";
      alert(error.message || "We couldn’t send your response. Please check your connection and try again.");
      return;
    }
    const first = name.split(/\s+/)[0], yes = attending === "Yes";
    $("mark").textContent = yes ? "✓" : "♡";
    $("done-title").textContent = yes ? `We’re delighted you’ll celebrate with us, ${first}!` : `We’ll miss you, ${first}.`;
    $("done-text").textContent = yes ? "We can’t wait to celebrate together on 2 December at Maran Illam."
                                   : "Thank you for letting us know. We hope to celebrate together another time.";
    $("card").classList.add("sent");
  });

  ["name", "phone"].forEach(id => $(id).addEventListener("input", e => e.target.closest(".field").classList.remove("invalid")));
  form.querySelectorAll("input[name=attending]").forEach(r => r.addEventListener("change", () => $("f-attend").classList.remove("invalid")));
</script>
</body>
</html>
