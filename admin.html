<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Manivizha | Response dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #fffaf0;
      --cream: #fcf2dd;
      --gold: #b98336;
      --brown: #4a2e14;
      --muted: #80684c;
      --line: #ead9bc;
      --red: #a53138;
      --green: #376d43;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--brown);
      background: #f8edda;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1120px, 100%); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
    .brand { margin: 0; font: 600 2.2rem/1 "Cormorant Garamond", Georgia, serif; }
    .eyebrow { margin: 0 0 6px; color: var(--gold); font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .panel, .stat { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 12px 30px rgba(74,46,20,.06); }
    .login { width: min(440px, 100%); margin: 10vh auto 0; padding: 30px; }
    .login h1 { margin: 0 0 8px; font: 600 2.2rem/1.1 "Cormorant Garamond", Georgia, serif; }
    .login p { color: var(--muted); line-height: 1.6; }
    label { display: block; margin: 20px 0 7px; font-size: .85rem; font-weight: 700; }
    input[type=password], input[type=search], select {
      width: 100%; min-height: 44px; padding: 10px 12px; color: var(--brown); background: white;
      border: 1px solid var(--line); border-radius: 9px;
    }
    input:focus, select:focus, button:focus-visible { outline: 3px solid #e8c486; outline-offset: 2px; }
    .button { min-height: 42px; padding: 9px 16px; border: 0; border-radius: 9px; color: white; background: var(--brown); font-weight: 700; }
    .button.secondary { border: 1px solid var(--line); color: var(--brown); background: var(--paper); }
    .login .button { width: 100%; margin-top: 18px; }
    .message { min-height: 1.4em; margin: 12px 0 0; color: var(--red); font-size: .88rem; }
    .muted { color: var(--muted); }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    .invitation-editors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
    .invitation-editor { display: grid; align-content: start; gap: 14px; padding: 18px; }
    .invitation-editor h2 { margin: 0; font: 600 1.5rem/1.1 "Cormorant Garamond", Georgia, serif; }
    .invitation-editor label { margin: 0 0 6px; }
    .invitation-editor input[type=file] { width: 100%; min-height: 44px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--brown); }
    .image-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .invitation-editor .image-status { min-height: 1.4em; margin: 0; color: var(--muted); font-size: .88rem; }
    .invitation-editor .image-status.error { color: var(--red); }
    .invitation-editor .image-status.success { color: var(--green); }
    .image-previews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .image-preview-tile { min-width: 0; margin: 0; }
    .image-preview-tile figcaption { margin-bottom: 6px; color: var(--muted); font-size: .78rem; font-weight: 700; }
    .image-preview, .current-image { display: block; width: 100%; max-height: 320px; border: 1px solid var(--line); border-radius: 8px; background: white; object-fit: contain; object-position: top center; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat { padding: 18px; }
    .stat-label { margin: 0 0 8px; color: var(--muted); font-size: .82rem; font-weight: 600; }
    .stat-value { margin: 0; font-size: 1.75rem; font-weight: 700; }
    .filters { display: grid; grid-template-columns: minmax(200px, 1fr) 190px auto; gap: 14px; align-items: end; padding: 16px; border-bottom: 1px solid var(--line); }
    .filters label { margin: 0 0 6px; }
    .check { display: flex; min-height: 44px; align-items: center; gap: 9px; color: var(--brown); font-size: .88rem; font-weight: 600; }
    .check input { width: 17px; height: 17px; accent-color: var(--gold); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 13px 16px; border-bottom: 1px solid #f0e5d3; vertical-align: middle; }
    th { color: var(--muted); font-size: .73rem; letter-spacing: .06em; text-transform: uppercase; }
    td { font-size: .88rem; }
    tbody tr:last-child td { border-bottom: 0; }
    .pill { display: inline-block; padding: 4px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
    .yes { color: var(--green); background: #e7f2e6; }
    .no { color: #84542a; background: #f7ead8; }
    .duplicate { color: #8d3437; background: #f8e5e2; }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
    .table-status { padding: 12px 16px; color: var(--muted); font-size: .82rem; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      body { padding: 22px 12px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .stat { padding: 14px; }
      .stat-value { font-size: 1.45rem; }
      .filters { grid-template-columns: 1fr; }
      .invitation-editors { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: stretch; }
      th, td { padding: 11px 12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel login" id="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Manivizha</p>
      <h1 id="login-title">Response dashboard</h1>
      <p>Sign in to view and manage RSVP responses.</p>
      <form id="login-form">
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button" type="submit" id="login-button">Sign in</button>
      </form>
      <p class="message" id="login-message" role="alert"></p>
    </section>

    <main id="dashboard" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">Manivizha · RSVP</p>
          <h1 class="brand">Response dashboard</h1>
        </div>
        <div class="toolbar">
          <button class="button secondary" id="sync-sheet" type="button">Sync sheet</button>
          <button class="button secondary" id="refresh" type="button">Refresh</button>
          <button class="button" id="logout" type="button">Sign out</button>
        </div>
      </header>

      <section class="invitation-editors" aria-label="Invitation image editors">
        <form class="panel invitation-editor" data-language="tamil">
          <h2>Tamil invitation</h2>
          <div>
            <label for="invitation-image-tamil">Choose a new PNG (larger images are resized to fit)</label>
            <input id="invitation-image-tamil" type="file" accept="image/png,.png" required>
          </div>
          <div class="image-actions">
            <button class="button secondary preview-invitation" type="button" disabled>Preview replacement</button>
            <button class="button save-invitation" type="submit" disabled>Save Tamil image to GitHub</button>
          </div>
          <div class="image-previews">
            <figure class="image-preview-tile">
              <figcaption>Current published image</figcaption>
              <img class="current-image" data-asset="TAMIL.png" alt="Current published Tamil invitation">
            </figure>
            <figure class="image-preview-tile replacement-preview" hidden>
              <figcaption>Replacement preview</figcaption>
              <img class="image-preview" alt="Selected Tamil invitation image">
            </figure>
          </div>
          <p class="image-status" role="status" aria-live="polite"></p>
        </form>
        <form class="panel invitation-editor" data-language="english">
          <h2>English invitation</h2>
          <div>
            <label for="invitation-image-english">Choose a new PNG (larger images are resized to fit)</label>
            <input id="invitation-image-english" type="file" accept="image/png,.png" required>
          </div>
          <div class="image-actions">
            <button class="button secondary preview-invitation" type="button" disabled>Preview replacement</button>
            <button class="button save-invitation" type="submit" disabled>Save English image to GitHub</button>
          </div>
          <div class="image-previews">
            <figure class="image-preview-tile">
              <figcaption>Current published image</figcaption>
              <img class="current-image" data-asset="ENGLISH.png" alt="Current published English invitation">
            </figure>
            <figure class="image-preview-tile replacement-preview" hidden>
              <figcaption>Replacement preview</figcaption>
              <img class="image-preview" alt="Selected English invitation image">
            </figure>
          </div>
          <p class="image-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="stats" aria-label="Response totals">
        <article class="stat"><p class="stat-label">Total responses</p><p class="stat-value" id="total-responses">0</p></article>
        <article class="stat"><p class="stat-label">Unique guests</p><p class="stat-value" id="unique-guests">0</p></article>
        <article class="stat"><p class="stat-label">Duplicate submissions</p><p class="stat-value" id="duplicate-responses">0</p></article>
        <article class="stat"><p class="stat-label">RSVP Confirmed</p><p class="stat-value" id="attending-yes">0</p></article>
      </section>

      <section class="panel" aria-label="RSVP response list">
        <div class="filters">
          <div>
            <label for="search">Search name or phone</label>
            <input id="search" type="search" placeholder="Type to search">
          </div>
          <div>
            <label for="attendance-filter">Attendance</label>
            <select id="attendance-filter">
              <option value="all">Everyone</option>
              <option value="Yes">RSVP Confirmed</option>
              <option value="No">Not attending</option>
            </select>
          </div>
          <label class="check" for="include-duplicates">
            <input id="include-duplicates" type="checkbox">
            Include duplicate submissions
          </label>
        </div>
        <p class="table-status" id="table-status" role="status">Loading responses…</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th scope="col">Name</th><th scope="col">Phone</th><th scope="col">RSVP</th><th scope="col">Submitted</th><th scope="col">Duplicate status</th></tr>
            </thead>
            <tbody id="response-rows"></tbody>
          </table>
        </div>
      </section>
      <p class="message" id="dashboard-message" role="alert"></p>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const loginPanel = $("login-panel");
    const dashboard = $("dashboard");
    const loginMessage = $("login-message");
    const dashboardMessage = $("dashboard-message");
    let responses = [];

    async function requestJson(url, options) {
      const response = await fetch(url, { cache: "no-store", ...options });
      let payload = {};
      try {
        payload = await response.json();
      } catch {
        payload = {};
      }
      if (!response.ok) {
        const error = new Error(payload.error || "The request failed. Please try again.");
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function showLogin() {
      dashboard.hidden = true;
      loginPanel.hidden = false;
      $("password").focus();
    }

    function showDashboard() {
      loginPanel.hidden = true;
      dashboard.hidden = false;
    }

    function addCell(row, value) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.appendChild(cell);
      return cell;
    }

    function renderRows() {
      const query = $("search").value.trim().toLowerCase();
      const digits = query.replace(/\D/g, "");
      const attendance = $("attendance-filter").value;
      const visible = responses.filter(item => {
        const phone = item.phone || "";
        const matchesSearch = !query || item.name.toLowerCase().includes(query) ||
          phone.toLowerCase().includes(query) || (digits && phone.replace(/\D/g, "").includes(digits));
        return matchesSearch && (attendance === "all" || item.attending === attendance);
      });

      const body = $("response-rows");
      body.replaceChildren();
      if (!visible.length) {
        const row = document.createElement("tr");
        const cell = addCell(row, "No responses match these filters.");
        cell.colSpan = 5;
        cell.className = "empty";
        body.appendChild(row);
      } else {
        for (const item of visible) {
          const row = document.createElement("tr");
          addCell(row, item.name);
          addCell(row, item.phone || "Not provided");
          const attendanceCell = addCell(row, "");
          const attendanceBadge = document.createElement("span");
          attendanceBadge.className = `pill ${item.attending === "Yes" ? "yes" : "no"}`;
          attendanceBadge.textContent = item.attending === "Yes" ? "RSVP Confirmed" : "Not attending";
          attendanceCell.appendChild(attendanceBadge);
          const submittedAt = new Date(item.createdAt);
          addCell(row, Number.isNaN(submittedAt.getTime()) ? item.createdAt : submittedAt.toLocaleString());
          const duplicateCell = addCell(row, "");
          if (item.isDuplicate || item.duplicateCount > 0) {
            const badge = document.createElement("span");
            badge.className = "pill duplicate";
            badge.textContent = item.isDuplicate
              ? "Duplicate"
              : `Latest · ${item.duplicateCount} earlier`;
            duplicateCell.appendChild(badge);
          } else {
            duplicateCell.textContent = "—";
          }
          body.appendChild(row);
        }
      }
      $("table-status").textContent = `Showing ${visible.length} of ${responses.length} ${$("include-duplicates").checked ? "submissions" : "latest responses"}.`;
    }

    async function loadResponses() {
      $("table-status").textContent = "Loading responses…";
      dashboardMessage.textContent = "";
      try {
        const include = $("include-duplicates").checked ? "1" : "0";
        const payload = await requestJson(`/api/responses?includeDuplicates=${include}`);
        responses = payload.responses;
        $("total-responses").textContent = payload.stats.totalResponses;
        $("unique-guests").textContent = payload.stats.uniqueGuests;
        $("duplicate-responses").textContent = payload.stats.duplicateResponses;
        $("attending-yes").textContent = payload.stats.attendingYes;
        renderRows();
      } catch (error) {
        if (error.status === 401) {
          showLogin();
          loginMessage.textContent = "Please sign in to view responses.";
        } else if (dashboard.hidden) {
          showLogin();
          loginMessage.textContent = error.message;
        } else {
          dashboardMessage.textContent = error.message;
          $("table-status").textContent = "Responses could not be loaded.";
        }
      }
    }

    $("login-form").addEventListener("submit", async event => {
      event.preventDefault();
      const button = $("login-button");
      button.disabled = true;
      loginMessage.textContent = "";
      try {
        await requestJson("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("password").value })
        });
        $("password").value = "";
        showDashboard();
        await loadResponses();
      } catch (error) {
        loginMessage.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    $("refresh").addEventListener("click", loadResponses);
    async function readInvitationImage(file) {
      const maxBytes = 3 * 1024 * 1024;
      let uploadFile = file;
      if (file.size > maxBytes) {
        if (file.size > 15 * 1024 * 1024 || typeof createImageBitmap !== "function") {
          throw new Error("Choose a PNG image under 15 MB that this browser can resize.");
        }
        const bitmap = await createImageBitmap(file);
        try {
          let scale = Math.sqrt(maxBytes / file.size) * 0.95;
          let blob;
          while (scale >= 0.5) {
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(bitmap.width * scale));
            canvas.height = Math.max(1, Math.round(bitmap.height * scale));
            const context = canvas.getContext("2d");
            if (!context) throw new Error("The selected image could not be resized.");
            context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
            if (!blob) throw new Error("The selected image could not be resized.");
            if (blob.size <= maxBytes) break;
            scale *= 0.9;
          }
          if (!blob || blob.size > maxBytes) {
            throw new Error("This image could not be resized below 3 MB.");
          }
          uploadFile = blob;
        } finally {
          bitmap.close();
        }
      }

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("The selected image could not be read."));
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.readAsDataURL(uploadFile);
      });
    }

    document.querySelectorAll(".invitation-editor").forEach(editor => {
      const language = editor.dataset.language;
      const fileInput = editor.querySelector('input[type="file"]');
      const previewButton = editor.querySelector(".preview-invitation");
      const saveButton = editor.querySelector(".save-invitation");
      const currentImage = editor.querySelector(".current-image");
      const replacement = editor.querySelector(".replacement-preview");
      const preview = editor.querySelector(".image-preview");
      const status = editor.querySelector(".image-status");
      let previewUrl = "";

      currentImage.addEventListener("error", () => {
        status.textContent = `Could not load the current published image (${currentImage.dataset.asset}).`;
        status.className = "image-status error";
      });
      currentImage.src = `${currentImage.dataset.asset}?preview=${Date.now()}`;

      fileInput.addEventListener("change", () => {
        saveButton.disabled = true;
        previewButton.disabled = true;
        previewButton.textContent = "Preview replacement";
        replacement.hidden = true;
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = "";
        preview.removeAttribute("src");
        status.className = "image-status";
        status.textContent = "";
        const file = fileInput.files[0];
        if (!file) return;
        if ((file.type && file.type !== "image/png") || file.size > 15 * 1024 * 1024) {
          status.textContent = "Choose a PNG image no larger than 15 MB.";
          status.classList.add("error");
          return;
        }

        previewUrl = URL.createObjectURL(file);
        const selectedUrl = previewUrl;
        preview.onload = () => {
          if (previewUrl !== selectedUrl) return;
          saveButton.disabled = false;
          status.textContent = "Preview shown below. Save when it looks right.";
        };
        preview.onerror = () => {
          if (previewUrl !== selectedUrl) return;
          saveButton.disabled = true;
          status.textContent = "This file could not be previewed as an image.";
          status.classList.add("error");
        };
        preview.src = previewUrl;
        replacement.hidden = false;
        previewButton.disabled = false;
        previewButton.textContent = "Hide replacement preview";
        status.textContent = "Loading preview…";
      });

      previewButton.addEventListener("click", () => {
        status.className = "image-status";
        if (!previewUrl) {
          status.textContent = "Choose a PNG image before previewing.";
          status.classList.add("error");
          return;
        }
        replacement.hidden = !replacement.hidden;
        previewButton.textContent = replacement.hidden ? "Preview replacement" : "Hide replacement preview";
        status.textContent = replacement.hidden ? "" : "Replacement preview shown next to the current image.";
      });

      editor.addEventListener("submit", async event => {
        event.preventDefault();
        const file = fileInput.files[0];
        status.className = "image-status";
        if (!file || saveButton.disabled) {
          status.textContent = "Preview the selected image before saving.";
          status.classList.add("error");
          return;
        }
        saveButton.disabled = true;
        previewButton.disabled = true;
        status.textContent = file.size > 3 * 1024 * 1024
          ? "Resizing image and committing to GitHub…"
          : "Committing image to GitHub…";
        try {
          const image = await readInvitationImage(file);
          const result = await requestJson("/api/admin/update-invitation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ language, image })
          });
          status.textContent = `${result.language} image committed to GitHub (${result.commit}). Vercel will update the live page after deployment.`;
          status.classList.add("success");
        } catch (error) {
          status.textContent = error.message;
          status.classList.add("error");
          saveButton.disabled = false;
        } finally {
          previewButton.disabled = false;
        }
      });
    });
    $("sync-sheet").addEventListener("click", async () => {
      const button = $("sync-sheet");
      button.disabled = true;
      dashboardMessage.textContent = "Syncing responses to Google Sheets…";
      try {
        const result = await requestJson("/api/admin/sync-sheets", { method: "POST" });
        dashboardMessage.textContent = `Sheet sync complete: ${result.inserted} added, ${result.skipped} already present.`;
      } catch (error) {
        dashboardMessage.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    $("include-duplicates").addEventListener("change", loadResponses);
    $("search").addEventListener("input", renderRows);
    $("attendance-filter").addEventListener("change", renderRows);
    $("logout").addEventListener("click", async () => {
      try {
        await requestJson("/api/admin/logout", { method: "POST" });
        responses = [];
        showLogin();
        loginMessage.textContent = "You have signed out.";
      } catch (error) {
        dashboardMessage.textContent = error.message;
      }
    });

    loadResponses();
  </script>
</body>
</html>
